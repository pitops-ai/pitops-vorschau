body { margin: 0; background: var(--h-grund); color: var(--h-text); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--link-hover); }
button { font: inherit; cursor: pointer; }
.po-btn-red { transition: background .18s cubic-bezier(.16,.84,.44,1); }
.po-btn-red:hover { background: #C22A21 !important; color: #FFFFFF !important; }
.po-btn-ghost { transition: border-color .18s cubic-bezier(.16,.84,.44,1); }
.po-btn-ghost:hover { border-color: var(--h-text) !important; color: var(--h-text) !important; }
.po-btn-ghost-d { transition: border-color .18s cubic-bezier(.16,.84,.44,1); }
.po-btn-ghost-d:hover { border-color: var(--d-text) !important; color: var(--d-text) !important; }
.po-btn-ink:hover { background: var(--ink-hover) !important; color: var(--ink-hover-t) !important; }

.po-card:hover { border-color: var(--d-linie2) !important; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #F05349; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* Umschalter zwischen den beiden Fassungen */
#fassung {
  position: fixed; right: 20px; bottom: 20px; z-index: 50;
  display: inline-flex; gap: 4px; padding: 4px;
  background: var(--h-karte); border: 1px solid var(--h-linie2);
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}
#fassung button {
  border: 0; background: transparent; color: var(--h-text2);
  font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  padding: 9px 14px; min-height: 36px; border-radius: 8px;
  transition: background .18s cubic-bezier(.16,.84,.44,1);
}
#fassung button[aria-pressed="true"] { background: #E63329; color: #FFFFFF; }
#fassung button:hover[aria-pressed="false"] { color: var(--h-text); }
@media (max-width: 600px) { #fassung { right: 12px; bottom: 12px; } }

<script>

var Component = {
  state: { role: 'service', mode: 'after', sites: 3, calls: 80, open: 0, sent: false }
,
  renderVals: function () {
    var s = this.state;
    var self = this;
    var roleDefs = [
      { id: 'service', label: 'Serviceberatung', title: 'Service-Cockpit' },
      { id: 'sales', label: 'Verkauf', title: 'Vertriebs-Cockpit' },
      { id: 'fibu', label: 'Buchhaltung', title: 'Buchhaltungs-Cockpit' },
      { id: 'gf', label: 'Geschäftsführung', title: 'Dashboard Geschäftsführung' }
    ];
    var roles = roleDefs.map(function (r) {
      var on = s.role === r.id;
      return {
        label: r.label,
        sel: on ? 'true' : 'false',
        bg: on ? '#E63329' : 'transparent',
        fg: on ? '#FFFFFF' : 'var(--h-text2)',
        bd: on ? '#E63329' : 'var(--h-linie2)',
        pick: function () { self.setState({ role: r.id }); }
      };
    });
    var roleTitle = roleDefs.filter(function (r) { return r.id === s.role; })[0].title;

    var before = [
      { time: '07:58', title: 'Leitung belegt.', text: 'Das Telefon klingelt im Minutentakt, Kunden legen auf, Rückrufzettel stapeln sich.' },
      { time: '08:30', title: 'Anfragen vom Wochenende warten.', text: 'Die erste Antwort auf Online-Leads kommt am Nachmittag.' },
      { time: '10:15', title: 'Annahme sucht Informationen zusammen.', text: 'Historie, Rückrufaktionen und fällige Arbeiten aus drei Systemen.' },
      { time: '14:00', title: 'Gebrauchtwagen stehen.', text: 'Preisanpassungen werden auf später verschoben.' },
      { time: '17:30', title: 'Der Belegstapel wächst.', text: 'Abgleiche für den Monatsabschluss bleiben liegen.' }
    ];
    var after = [
      { time: '07:58', title: 'Jeder Anruf wird angenommen.', text: 'Der Voicebot bucht direkt im Werkstattplaner und übergibt Sonderfälle mit Zusammenfassung.' },
      { time: '08:05', title: 'Alle Leads sind beantwortet.', text: 'Der Marketing- und Vertriebs-Agent hat Probefahrten vorgeschlagen und Angebote vorbereitet.' },
      { time: '10:15', title: 'Die Annahme ist vorbereitet.', text: 'Historie, Rückrufe und Zusatzarbeiten liegen schon im Cockpit.' },
      { time: '14:00', title: 'Standzeit-Warnung mit Preisvorschlag.', text: 'Der GW-Agent meldet, welche Fahrzeuge jetzt Aufmerksamkeit brauchen.' },
      { time: '17:30', title: 'Belege sind vorkontiert.', text: 'Die Buchhaltung prüft Abweichungen und gibt frei.' }
    ];
    var isAfter = s.mode === 'after';
    var dot = isAfter ? '#E63329' : 'var(--h-text3)';
    var timeline = (isAfter ? after : before).map(function (t) {
      return { time: t.time, title: t.title, text: t.text, dot: dot };
    });

    var hoursNum = Math.round(s.sites * s.calls * 0.6 * 3 / 60 * 21);
    var fteNum = hoursNum / 160;

    var faqDefs = [
      { q: 'Müssen wir unser DMS wechseln?', a: 'Nein. pitops arbeitet über Schnittstellen mit Ihrem DMS und Werkstattplaner. Ihr DMS bleibt das führende System.' },
      { q: 'Wo werden unsere Daten verarbeitet?', a: 'Auf Servern in der EU, mit Auftragsverarbeitungsvertrag nach DSGVO. TOMs und Unterauftragsverarbeiter finden Sie im Trust Center.' },
      { q: 'Merken Kunden, dass sie mit einer KI sprechen?', a: 'Ja. Der Voicebot weist zu Beginn darauf hin, wie es der EU AI Act verlangt. Bei Bedarf übergibt er an Ihr Team.' },
      { q: 'Wie aufwendig ist die Einführung?', a: 'Nach Erstgespräch und Prozess-Check richten wir einen Agenten an einem Standort ein. Er läuft zwei bis vier Wochen im Schattenbetrieb mit, bevor er live geht. Anbindung und Einrichtung übernimmt unser Team, Sie liefern Betriebswissen und Freigaberegeln.' },
      { q: 'Was ist mit dem Betriebsrat?', a: 'Wir stellen Unterlagen für die Mitbestimmung bereit. Welche Daten ausgewertet werden, legen Sie fest.' },
      { q: 'Wie lange ist die Vertragslaufzeit?', a: 'Nach dem Pilot entscheiden Sie über den Rollout. Laufzeit: [Laufzeit festlegen].' },
      { q: 'Was kostet pitops?', a: 'Agenten ab 390 € pro Standort und Monat zuzüglich einmaliger Einrichtung. Der Pilot hat einen Festpreis ab 6.000 €.' }
    ];
    var faqs = faqDefs.map(function (f, i) {
      var on = s.open === i;
      return {
        q: f.q, a: f.a,
        open: on,
        sign: on ? '–' : '+',
        toggle: function () { self.setState({ open: on ? -1 : i }); }
      };
    });

    return {
      roles: roles,
      roleTitle: roleTitle,
      isService: s.role === 'service',
      isSales: s.role === 'sales',
      isFibu: s.role === 'fibu',
      isGf: s.role === 'gf',
      timeline: timeline,
      beforeSel: isAfter ? 'false' : 'true',
      afterSel: isAfter ? 'true' : 'false',
      beforeBg: isAfter ? 'transparent' : 'var(--h-kontrast-f)',
      beforeFg: isAfter ? 'var(--h-text2)' : 'var(--h-kontrast-t)',
      afterBg: isAfter ? '#E63329' : 'transparent',
      afterFg: isAfter ? '#FFFFFF' : 'var(--h-text2)',
      showBefore: function () { self.setState({ mode: 'before' }); },
      showAfter: function () { self.setState({ mode: 'after' }); },
      sites: s.sites,
      calls: s.calls,
      hours: hoursNum.toLocaleString('de-DE'),
      fte: fteNum.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
      incSites: function () { self.setState({ sites: Math.min(30, s.sites + 1) }); },
      decSites: function () { self.setState({ sites: Math.max(1, s.sites - 1) }); },
      incCalls: function () { self.setState({ calls: Math.min(400, s.calls + 10) }); },
      decCalls: function () { self.setState({ calls: Math.max(10, s.calls - 10) }); },
      notSent: !s.sent,
      sent: s.sent,
      send: function () { self.setState({ sent: true }); },
      faqs: faqs
    };
  }
};
(function () {
  var wurzel = document.getElementById('seite');
  var vorlage = document.getElementById('vorlage').content;

  function hole(bereich, pfad) {
    var teile = pfad.trim().split('.'), v = bereich;
    for (var i = 0; i < teile.length; i++) {
      if (v == null) return undefined;
      v = v[teile[i]];
    }
    return v;
  }
  function fuelle(text, bereich) {
    return text.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, p) {
      if (p === 'true') return 'true';
      if (p === 'false') return 'false';
      var v = hole(bereich, p);
      return v == null ? '' : String(v);
    });
  }
  function gehe(quelle, bereich, ziel) {
    for (var k = 0; k < quelle.childNodes.length; k++) {
      var n = quelle.childNodes[k];
      if (n.nodeType === 3) {
        var s = fuelle(n.nodeValue, bereich);
        if (s) ziel.appendChild(document.createTextNode(s));
        continue;
      }
      if (n.nodeType !== 1) continue;
      var tag = n.nodeName.toLowerCase();
      if (tag === 'sc-for') {
        var liste = hole(bereich, n.getAttribute('list').replace(/[{}]/g, '')) || [];
        var als = n.getAttribute('as');
        for (var i = 0; i < liste.length; i++) {
          var unter = Object.create(bereich);
          unter[als] = liste[i];
          gehe(n, unter, ziel);
        }
        continue;
      }
      if (tag === 'sc-if') {
        if (hole(bereich, n.getAttribute('value').replace(/[{}]/g, ''))) gehe(n, bereich, ziel);
        continue;
      }
      var el = n.cloneNode(false);
      for (var a = el.attributes.length - 1; a >= 0; a--) {
        var at = el.attributes[a];
        if (at.name === 'data-on-click') {
          var fn = hole(bereich, at.value.replace(/[{}]/g, ''));
          el.removeAttribute(at.name);
          if (typeof fn === 'function') el.addEventListener('click', fn);
        } else if (at.value.indexOf('{{') > -1) {
          el.setAttribute(at.name, fuelle(at.value, bereich));
        }
      }
      gehe(n, bereich, el);
      ziel.appendChild(el);
    }
  }
  function pfadVon(el) {
    var p = [];
    while (el && el !== wurzel) {
      p.push(Array.prototype.indexOf.call(el.parentNode.childNodes, el));
      el = el.parentNode;
    }
    return p.join('-');
  }
  function nachPfad(p) {
    var teile = p.split('-').reverse(), el = wurzel;
    for (var i = 0; i < teile.length; i++) el = el && el.childNodes[+teile[i]];
    return el;
  }
  function zeichne() {
    var fokus = document.activeElement && wurzel.contains(document.activeElement)
      ? pfadVon(document.activeElement) : null;
    var neu = document.createDocumentFragment();
    gehe(vorlage, Component.renderVals(), neu);
    wurzel.textContent = '';
    wurzel.appendChild(neu);
    if (fokus) { var z = nachPfad(fokus); if (z && z.focus) z.focus(); }
  }
  Component.setState = function (teil) {
    for (var k in teil) Component.state[k] = teil[k];
    zeichne();
  };
  zeichne();
})();


(function () {
  var wurzel = document.documentElement, leiste = document.getElementById('fassung');
  function setze(f, merken) {
    wurzel.setAttribute('data-fassung', f);
    var k = leiste.querySelectorAll('button');
    for (var i = 0; i < k.length; i++)
      k[i].setAttribute('aria-pressed', k[i].getAttribute('data-f') === f ? 'true' : 'false');
    if (merken) { try { localStorage.setItem('pitops-fassung', f); } catch (e) {} }
  }
  var start = null;
  try { start = localStorage.getItem('pitops-fassung'); } catch (e) {}
  if (start !== 'hell' && start !== 'dunkel') start = 'hell';
  setze(start, false);
  leiste.addEventListener('click', function (e) {
    var k = e.target.closest('button[data-f]');
    if (k) setze(k.getAttribute('data-f'), true);
  });
})();
